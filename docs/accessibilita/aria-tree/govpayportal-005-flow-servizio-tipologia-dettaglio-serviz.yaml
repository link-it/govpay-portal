  - paragraph: Concessione per l’apertura e l’esercizio di farmacie
  - paragraph: Tasse sulle Concessioni Regionali
  - text: La tassa è riferita non soltanto alle concessioni per l’apertura e l’esercizio di nuove farmacie, ma anche alle concessioni per l’esercizio di farmacie già istituite e conferite ad altri titolari. La concessione per l’apertura e l’esercizio di una farmacia è valevole solo per la sede indicata nella concessione stessa e pertanto la tassa è dovuta, anche nel caso in cui venga concesso il trasferimento da una sede ad un’altra dello stesso Comune. La tassa non è dovuta nel caso di trasferimento di farmacia entro i limiti della stessa sede. Mail
