sonar.projectKey=link-it_govpay-portal
sonar.organization=link-it

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# src/assets/extensions contiene librerie di terze parti copiate nel progetto
# (es. codicefiscale.js): non le manuteniamo, quindi analizzarle produce solo rumore.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,src/assets/extensions/**

# Il report deve essere in formato LCOV: puntare questa proprieta' a clover.xml
# fa fallire il parsing in silenzio e la copertura risulta 0%.
# lcov.info e' prodotto dal reporter "lcovonly" configurato nel target test di angular.json.
sonar.javascript.lcov.reportPaths=coverage/govpay-portal/lcov.info

sonar.coverage.exclusions=**/*.spec.ts,src/test-setup.ts,src/assets/extensions/**,src/environments/version.ts

sonar.sourceEncoding=UTF-8
